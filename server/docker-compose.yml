name: omni-caller

services:
   postgres:
      image: postgres:17-alpine
      container_name: omni-caller-postgres
      restart: unless-stopped
      environment:
         POSTGRES_USER: ${POSTGRES_USER:-postgres}
         POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
         POSTGRES_DB: ${POSTGRES_DB:-omnicaller}
      ports:
         - '5432:5432'
      volumes:
         - postgres_data:/var/lib/postgresql/data
      healthcheck:
         test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-omnicaller}']
         interval: 5s
         timeout: 5s
         retries: 5
      networks:
         - omni-network

   redis:
      image: redis:alpine
      container_name: omni-caller-redis
      restart: unless-stopped
      ports:
         - '6379:6379'
      volumes:
         - redis_data:/data
      healthcheck:
         test: ['CMD', 'redis-cli', 'ping']
         interval: 5s
         timeout: 3s
         retries: 5
      networks:
         - omni-network

   livekit:
      image: livekit/livekit-server:latest
      container_name: omni-caller-livekit
      restart: unless-stopped
      command: --config /etc/livekit.yaml
      ports:
         - '7880:7880' # HTTP/WebSocket
         - '7881:7881' # TURN/UDP
         - '7882:7882' # TURN/TLS
         - '50000-50200:50000-50200/udp' # RTC/UDP
      volumes:
         - ./livekit.yaml:/etc/livekit.yaml
      environment:
         LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
         LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
      healthcheck:
         test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:7880']
         interval: 10s
         timeout: 5s
         retries: 3
      networks:
         - omni-network

   server:
      build:
         context: .
         dockerfile: Dockerfile
      container_name: omni-caller-server
      restart: unless-stopped
      ports:
         - '3000:3000'
      environment:
         SERVER_HOST: ${SERVER_HOST:-0.0.0.0}
         SERVER_PORT: ${SERVER_PORT:-3000}
         APP_ENV: ${APP_ENV:-production}
         LOG_LEVEL: ${LOG_LEVEL:-info}
         DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-omnicaller}
         DATABASE_MAX_CONNECTIONS: ${DATABASE_MAX_CONNECTIONS:-10}
         DATABASE_MIN_CONNECTIONS: ${DATABASE_MIN_CONNECTIONS:-2}
         DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-30}
         JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
         JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
         JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-900}
         JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}
         LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
         LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
         LIVEKIT_URL: ${LIVEKIT_URL:-ws://livekit:7880}
         LIVEKIT_HOST: ${LIVEKIT_HOST:-livekit:7880}
      depends_on:
         postgres:
            condition: service_healthy
         redis:
            condition: service_healthy
         livekit:
            condition: service_healthy
      healthcheck:
         test: ['CMD', 'pidof', 'omnicaller_server']
         interval: 30s
         timeout: 3s
         retries: 3
         start_period: 40s
      networks:
         - omni-network

   cloudflared:
      image: cloudflare/cloudflared:latest
      container_name: omni-caller-cloudflared
      restart: unless-stopped
      command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
      environment:
         TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
      depends_on:
         server:
            condition: service_healthy
      networks:
         - omni-network
      # Alternative: use config file instead of token
      # volumes:
      #    - ./cloudflared-config.yml:/etc/cloudflared/config.yml
      # command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run

networks:
   omni-network:
      driver: bridge

volumes:
   postgres_data:
   redis_data:
